version: 1

check:
  fail_on: block
  policy: true
  # honor_inline_ignore: true   # honor offsend:ignore in `offsend check` / CI
  # Prefer: offsend init --template node
  #          offsend init --list-templates
  #          offsend init --template python --merge-exclude
  # Known templates: common, node, python, go, rust, ruby, java, android, swift, tuist
  # Aliases: js/ts→node, ios→swift (`common` is always included.)
  exclude:
    - "*.lock"
    - ".DS_Store"
    - "Thumbs.db"
    - "Desktop.ini"
    - "**/dist/**"
    - "**/build/**"
    - "**/coverage/**"
    - "*.map"
    - "*.min.js"
    - "*.min.css"
    - ".eslintcache"
    - ".stylelintcache"
    - ".offsend/hooks/**"
    - "**/*.png"
    - "**/*.gif"
    - "**/*.jpg"
    - "**/*.jpeg"
    - "**/*.ico"
    - "**/*.webp"
    - "**/*.icns"
    # Optional — uncomment only if these dirs never hold secrets:
    # - "**/.cache/**"
    # - "**/tmp/**"
    # - "**/temp/**"
  detectors:
    # All detector IDs you can list under `disable:`:
    #   email, phone, money, url, ipAddress, internalDomain, contractId,
    #   invoiceId, orderId, apiKeyGeneric, openAIAPIKey, awsAccessKeyId,
    #   githubToken, slackToken, stripeKey, jwt, privateKey, sshPrivateKey,
    #   databaseURLWithPassword, bearerToken, highEntropyString, creditCardLike,
    #   iban, customClient, customCompany, customProject, customSensitiveTerm,
    #   customInternalDomain, personName, streetAddress, governmentId
    # Default keeps only secret/credential detectors active.
    disable:
      - email
      - phone
      - money
      - url
      - ipAddress
      - internalDomain
      - contractId
      - invoiceId
      - orderId
      - creditCardLike
      - iban
      - personName
      - streetAddress
      - governmentId
  # Custom dictionaries are matched in addition to the built-in detectors.
  # kind: client | company | project | sensitiveTerm | internalDomain | regex
  # For every kind except `regex`, `value` is matched literally (with word boundaries).
  # For `regex`, `value` is used as a regular expression pattern verbatim.
  dictionaries:
    - kind: client
      value: "Acme Corp"
    - kind: company
      value: "Globex"
    - kind: project
      value: "Project Apollo"
    - kind: sensitiveTerm
      value: "internal-codename"
    - kind: internalDomain
      value: "internal.example.com"
    - kind: regex
      value: "ACME-\\d{4,}"

# Team AI-ignore rules (source of truth). Materialize with `offsend sync`.
# `offsend ignore <pattern>` adds here; `offsend ignore --local` skips this file.
ignore:
  commit: false          # false = keep .cursorignore etc. out of git via .gitignore managed block
  # tools: [cursor, claude]   # optional; absent = all supported AI tools
  patterns: []
  # - "secrets/"
  # - "**/.env"

hooks:
  enabled: true          # default; sync installs hooks; doctor fails if git hooks are missing (CI --policy does not)
  git: [pre-commit, post-merge]  # pre-commit = check --staged; post-merge = sync after pull
  fail_on: block
  policy: true
  publish: false         # false = AI editor hooks stay local (not for commit)
  # ignore_exclude: true # true = read-gate checks every path, ignoring check.exclude (default: false)

# Optional AI-context controls used by `show`, `doctor`, and the editor gates
# (`offsend sync` / `offsend hook install`). See docs/configuration.md#contextmcp.
# Strict credentials recipe (also: offsend init --strict-credentials):
#   set tighter context (policy is already true from init), then:
# context:
#   read:
#     on_secret: block        # block | seal — seal: deny hands the agent a sealed copy
#                             # (secrets → {{TYPE:v1.…}} tokens; needs a seal key: offsend keygen --default)
#   shell:
#     mode: deny              # ask | deny — default deny (Cursor ignores ask for shell hooks)
#   mcp:
#     mode: ask               # observe | ask | deny (deny also fails closed on bad hook input)
#     allow: [github]         # non-empty allow = allowlist mode
#     deny: [postgres]        # or ["*"] for allowlist-only
#     high_risk: [filesystem, postgres]
#     responses: seal         # observe | warn | seal — MCP **response** scan (Cursor + Claude);
#                             # seal rewrites tool output before the model sees it
#                             # (needs a seal key: offsend keygen --default)
#     # Starter presets (uncomment and rename servers/tools to match your MCP config):
#     rules:
#       - match: { server: github, tool: list_* }
#         responses: observe        # low-risk list tools
#       - match: { server: postgres }
#         mode: ask                 # or deny for stricter repos
#         responses: seal
#       - match: { server: filesystem }
#         mode: ask
#         responses: seal
#       - match: { server: crm, tool: get_customer }
#         fields:                   # JSON paths; only when responses: seal
#           passport_number: seal   # bare key = any depth
#           account_id: pass        # keep; detectors still apply
#           meta.filters: drop      # key stays, value becomes null
#   subagents:
#     mode: deny              # observe | deny (ask is treated as deny on Cursor subagentStart)
#     scan_task: true         # secret-scan the subagent task prompt
#   history:
#     audit: true             # `offsend show` includes the agent-history section
#     scrub_on_protect: false # `offsend protect` also runs history scrub
#     scan_in_show: false     # content-scan transcripts in show/doctor (or: show --scan-history)
# Editor prompts stay soft-block unless: offsend hook install --hook-policy block

# OS sandbox for agent commands — the layer hooks cannot reach.
# Providers: sandbox.<name>.yml (shipped / global / project).
# - shipped ids (nono): project drop-in ignored (AI cannot rewrite exec)
# - custom project provider: requires `offsend policy trust`
# - enabled: false / network allow: only after trust
# See docs/configuration.md#sandbox.
# sandbox:
#   enabled: true             # true always; false ignored until policy trust
#   provider: nono            # sandbox.nono.yml
#   network:
#     default: deny           # allow / allow-list need trusted policy
#     allow: []
