name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "apps/macos/assets/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "apps/macos/assets/**"

jobs:
  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v4
      - uses: Offsend/ai-hygiene@v1
        with:
          fail-on: block
          policy: false
      # Consumer repos from `offsend init` set check.policy: true (and can pass
      # policy: true here). This repo keeps policy off because of detector fixtures.
      # Also recommended locally / in custom CI:
      #   offsend check --staged --policy --fail-on block
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # OffsendRustBridge force-loads a universal liboffsend_ffi.a (arm64 + x86_64).
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install Tuist
        uses: jdx/mise-action@v2
        with:
          install: true
          working_directory: apps/macos
      - name: Install dependencies
        run: tuist install
      # OffsendRustBridge force-loads Vendor/OffsendFFI/liboffsend_ffi.a (gitignored).
      # Build it before tuist/xcode so the linker input exists and script-phase failures are obvious.
      - name: Build Offsend FFI
        working-directory: ${{ github.workspace }}
        run: STAGE_SERVER=0 bash scripts/ffi/build.sh
      - name: Run tests
        run: tuist test

  cli:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test Rust workspace
        run: cargo test --workspace
      - name: Build Rust CLI
        run: cargo build -p offsend-cli --release
      - name: Run CLI E2E smoke
        run: bash scripts/ci/cli-e2e.sh target/release/offsend

  cli-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test Rust workspace
        run: cargo test --workspace
      - name: Build Rust CLI
        run: cargo build -p offsend-cli --release
      - name: Run CLI E2E smoke
        run: bash scripts/ci/cli-e2e.sh target/release/offsend
