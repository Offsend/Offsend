id: env-to-json-001
category: transformation
task: |
  Parse the env block.
  Return JSON with var_count (number), db_host, has_password_var (boolean).
  Count only assignment lines. Do not return secret values.
  JSON only. No markdown.
input: |
  APP_NAME=ledger
  DATABASE_URL=postgres://svc:{{fixture:password_006}}@core.example.com/ledger
sensitive:
  - type: password
    fixture: password_006
expected_structure:
  - "APP_NAME=ledger"
  - "postgres://svc:"
  - "@core.example.com/ledger"
grader:
  kind: json_fields
  expected:
    var_count: 2
    db_host: core.example.com
    has_password_var: true
placeholder:
  eligible: false
