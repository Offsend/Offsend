id: compose-multi-001
category: config
task: |
  Inspect the compose environment.
  Return JSON with postgres_host, redis_host, service_count (number).
  JSON only. No markdown.
input: |
  services:
    api:
      environment:
        DATABASE_URL=postgres://api:{{fixture:password_001}}@pg.example.com/shop
        REDIS_URL=redis://queue:{{fixture:password_002}}@queue.example.com:6379/1
sensitive:
  - type: password
    fixture: password_001
  - type: password
    fixture: password_002
expected_structure:
  - "postgres://api:"
  - "@pg.example.com/shop"
  - "redis://queue:"
  - "@queue.example.com:6379/1"
grader:
  kind: json_fields
  expected:
    postgres_host: pg.example.com
    redis_host: queue.example.com
    service_count: 1
placeholder:
  eligible: false
